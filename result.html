<!DOCTYPE html>
<html class="dark" lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Kết quả bài làm - Học Bản Chất</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;900&family=Noto+Sans:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "card-dark": "#1e293b",
                        "border-dark": "#282e39",
                        "text-secondary": "#9da6b9",
                        "success": "#10b981",
                        "error": "#f43f5e",
                    },
                    fontFamily: {
                        "display": ["Lexend", "Noto Sans", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #101622;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #3b4354;
            border-radius: 3px;
        }
    </style>
    <!-- Marked.js và KaTeX cho Markdown và Math -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-white min-h-screen flex flex-col overflow-x-hidden">
    <!-- Top Navigation Bar -->
    <header
        class="sticky top-0 z-50 w-full border-b border-gray-200 dark:border-border-dark bg-white dark:bg-[#111318]/95 backdrop-blur px-4 lg:px-10 py-3">
        <div class="mx-auto max-w-[1280px] flex items-center justify-between">
            <a class="flex items-center gap-3 text-gray-900 dark:text-white hover:opacity-80 transition-opacity"
                href="index.html">
                <div class="size-8 text-primary flex items-center justify-center">
                    <span class="material-symbols-outlined text-3xl">function</span>
                </div>
                <h2 class="text-lg font-bold">Học Bản Chất</h2>
            </a>
            <div class="flex items-center gap-4">
                <a href="index.html"
                    class="text-sm font-medium text-text-secondary hover:text-primary transition-colors">Trang chủ</a>
                <a href="course.html"
                    class="text-sm font-medium text-text-secondary hover:text-primary transition-colors">Khóa học</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full px-4 md:px-10 py-8 mx-auto max-w-6xl">
        <!-- Score Header Card -->
        <div
            class="bg-gradient-to-br from-primary to-blue-600 rounded-2xl p-6 md:p-10 text-white mb-8 shadow-2xl relative overflow-hidden">
            <div
                class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2">
            </div>
            <div class="relative z-10 flex flex-col md:flex-row items-center gap-6 md:gap-12">
                <!-- Score Circle -->
                <div class="relative">
                    <div
                        class="size-36 md:size-44 rounded-full bg-white/10 backdrop-blur flex items-center justify-center shadow-inner">
                        <div class="text-center">
                            <p id="score" class="text-5xl md:text-6xl font-black">0</p>
                            <p class="text-lg opacity-80">điểm</p>
                        </div>
                    </div>
                </div>
                <!-- Stats -->
                <div class="flex-1 text-center md:text-left">
                    <h1 id="result-title" class="text-2xl md:text-3xl font-bold mb-4">Kết quả bài làm</h1>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mt-4">
                        <div class="bg-white/10 backdrop-blur rounded-xl p-4">
                            <p class="text-3xl font-bold" id="correct-count">0</p>
                            <p class="text-sm opacity-80">Đúng</p>
                        </div>
                        <div class="bg-white/10 backdrop-blur rounded-xl p-4">
                            <p class="text-3xl font-bold" id="wrong-count">0</p>
                            <p class="text-sm opacity-80">Sai</p>
                        </div>
                        <div class="bg-white/10 backdrop-blur rounded-xl p-4">
                            <p class="text-3xl font-bold" id="unanswered-count">0</p>
                            <p class="text-sm opacity-80">Bỏ qua</p>
                        </div>
                        <div class="bg-white/10 backdrop-blur rounded-xl p-4">
                            <p class="text-3xl font-bold" id="time-spent">0:00</p>
                            <p class="text-sm opacity-80">Thời gian</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-wrap gap-4 mb-8">
            <a id="retry-btn" href="#"
                class="flex items-center gap-2 px-6 py-3 bg-primary hover:bg-primary/90 text-white rounded-lg font-bold transition-colors shadow-lg shadow-primary/20">
                <span class="material-symbols-outlined">replay</span>
                Làm lại
            </a>
            <a id="back-to-lesson-btn" href="#"
                class="flex items-center gap-2 px-6 py-3 bg-card-dark hover:bg-gray-700 text-white rounded-lg font-medium transition-colors border border-border-dark">
                <span class="material-symbols-outlined">arrow_back</span>
                Về bài học
            </a>
        </div>

        <!-- Questions Grid Map -->
        <div class="bg-white dark:bg-card-dark rounded-xl border border-gray-200 dark:border-border-dark p-6 mb-8">
            <h2 class="font-bold text-lg mb-4 text-gray-900 dark:text-white">Tổng quan câu hỏi</h2>
            <div id="questions-map" class="grid grid-cols-10 gap-2">
                <!-- Question map buttons will be rendered here -->
            </div>
            <div class="flex flex-wrap gap-4 mt-4 text-sm text-text-secondary">
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 rounded bg-success"></div>
                    <span>Đúng</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 rounded bg-error"></div>
                    <span>Sai</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 rounded bg-gray-400"></div>
                    <span>Bỏ qua</span>
                </div>
            </div>
        </div>

        <!-- Detailed Results -->
        <div class="flex flex-col gap-6" id="results-container">
            <!-- Question cards will be rendered here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 dark:border-border-dark py-8 mt-12 text-center text-text-secondary text-sm">
        <p>© 2024 HocBanChat. Nền tảng học toán trực tuyến miễn phí.</p>
    </footer>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/db.js"></script>

    <!-- Scripts -->
    <script>
        // Lấy tham số từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const resultId = urlParams.get('id');

        // Biến lưu kết quả
        let result = null;

        // Khởi tạo
        async function init() {
            if (resultId) {
                // Load từ Firestore nếu có ID
                await loadResultFromFirestore(resultId);
            } else {
                // Lấy từ localStorage (nếu vừa làm xong)
                result = JSON.parse(localStorage.getItem('quizResult') || '{}');
                processResult();
            }
        }

        // Load kết quả từ Firestore
        async function loadResultFromFirestore(id) {
            // Chờ Firebase khởi tạo
            const checkFirebase = setInterval(async () => {
                if (typeof firebase !== 'undefined' && firebase.apps.length && window.DB) {
                    clearInterval(checkFirebase);

                    const firestoreResult = await window.DB.getQuizResultById(id);
                    if (firestoreResult) {
                        // Chuyển đổi format từ Firestore sang format hiển thị
                        result = {
                            questions: firestoreResult.questions || [],
                            answers: firestoreResult.answers || {},
                            correct: firestoreResult.correctAnswers,
                            total: firestoreResult.totalQuestions,
                            score: firestoreResult.score,
                            timeSpent: firestoreResult.timeSpent,
                            courseId: firestoreResult.courseId,
                            lessonPath: firestoreResult.lessonPath
                        };
                        processResult();
                    } else {
                        showNoDataError();
                    }
                }
            }, 100);

            // Timeout sau 5 giây
            setTimeout(() => clearInterval(checkFirebase), 5000);
        }

        // Hiển thị lỗi không có dữ liệu
        function showNoDataError() {
            document.getElementById('results-container').innerHTML = `
                <div class="text-center py-12 text-text-secondary">
                    <span class="material-symbols-outlined text-5xl mb-4 block">quiz</span>
                    <p>Không tìm thấy dữ liệu kết quả. Có thể đã bị xóa hoặc không tồn tại.</p>
                    <a href="profile.html" class="inline-block mt-4 px-6 py-3 bg-primary text-white rounded-lg font-bold">Về hồ sơ</a>
                </div>
            `;
        }

        // Xử lý và hiển thị kết quả
        function processResult() {
            if (!result || !result.questions || result.questions.length === 0) {
                document.getElementById('results-container').innerHTML = `
                    <div class="text-center py-12 text-text-secondary">
                        <span class="material-symbols-outlined text-5xl mb-4 block">quiz</span>
                        <p>Không có dữ liệu kết quả. Vui lòng làm bài tập trước.</p>
                        <a href="index.html" class="inline-block mt-4 px-6 py-3 bg-primary text-white rounded-lg font-bold">Về trang chủ</a>
                    </div>
                `;
            } else {
                renderResults();
            }
        }

        // Khởi động
        init();

        function renderResults() {
            const { questions, answers, correct, total, score, timeSpent, courseId, lessonPath } = result;

            // Update header stats
            document.getElementById('score').textContent = score;
            document.getElementById('correct-count').textContent = correct;
            document.getElementById('wrong-count').textContent = total - correct - Object.keys(answers).filter(k => answers[k] === undefined).length;

            // Count unanswered
            const answeredCount = Object.keys(answers).length;
            const unanswered = total - answeredCount;
            document.getElementById('unanswered-count').textContent = unanswered;

            // Time spent
            const minutes = Math.floor(timeSpent / 60);
            const seconds = timeSpent % 60;
            document.getElementById('time-spent').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

            // Update title based on score
            const scoreNum = parseFloat(score);
            let title = 'Kết quả bài làm';
            if (scoreNum >= 9) title = '🎉 Xuất sắc!';
            else if (scoreNum >= 7) title = '👍 Tốt lắm!';
            else if (scoreNum >= 5) title = '📚 Cần cố gắng thêm';
            else title = '💪 Hãy thử lại nhé!';
            document.getElementById('result-title').textContent = title;

            // Update action buttons
            document.getElementById('retry-btn').href = `quiz.html?course=${courseId}&path=${encodeURIComponent(lessonPath)}`;
            document.getElementById('back-to-lesson-btn').href = `lesson.html?course=${courseId}&path=${encodeURIComponent(lessonPath)}`;

            // Render questions map
            const mapContainer = document.getElementById('questions-map');
            mapContainer.innerHTML = questions.map((q, i) => {
                // Hỗ trợ cả format chữ cái và số cho đáp án đúng
                const correctAnswer = q.answer || q.correctAnswer || 'A';
                const userAnswer = answers[i];

                // So sánh: convert về cùng format (chữ cái)
                const userAnswerLetter = typeof userAnswer === 'number'
                    ? String.fromCharCode(65 + userAnswer)
                    : userAnswer;
                const correctAnswerLetter = typeof correctAnswer === 'number'
                    ? String.fromCharCode(65 + correctAnswer)
                    : correctAnswer;

                const isCorrect = userAnswerLetter === correctAnswerLetter;
                const isUnanswered = userAnswer === undefined || userAnswer === null;

                let bgClass = 'bg-success';
                if (isUnanswered) bgClass = 'bg-gray-400';
                else if (!isCorrect) bgClass = 'bg-error';

                return `
                    <button onclick="scrollToQuestion(${i})" 
                        class="aspect-square flex items-center justify-center rounded-lg ${bgClass} text-white font-medium text-sm hover:opacity-80 transition-opacity">
                        ${i + 1}
                    </button>
                `;
            }).join('');

            // Xử lý xuống dòng với \n và render markdown
            function processAndRenderMarkdown(text) {
                if (!text) return '';
                const processed = text.replace(/\\n/g, '\n');
                return marked.parse(processed, { breaks: true });
            }

            // Render detailed results
            const container = document.getElementById('results-container');
            container.innerHTML = questions.map((q, i) => {
                // Hỗ trợ cả format chữ cái và số
                const correctAnswer = q.answer || q.correctAnswer || 'A';
                const userAnswer = answers[i];
                const options = q.options || q.choices || [];

                // Convert về chữ cái để so sánh
                const userAnswerLetter = typeof userAnswer === 'number'
                    ? String.fromCharCode(65 + userAnswer)
                    : userAnswer;
                const correctAnswerLetter = typeof correctAnswer === 'number'
                    ? String.fromCharCode(65 + correctAnswer)
                    : correctAnswer;

                const isCorrect = userAnswerLetter === correctAnswerLetter;
                const isUnanswered = userAnswer === undefined || userAnswer === null;

                // Determine card border color
                let borderClass = 'border-success';
                let headerBg = 'bg-success/10';
                let statusIcon = '<span class="material-symbols-outlined text-success">check_circle</span>';
                let statusText = 'Đúng';

                if (isUnanswered) {
                    borderClass = 'border-gray-400';
                    headerBg = 'bg-gray-400/10';
                    statusIcon = '<span class="material-symbols-outlined text-gray-400">remove_circle</span>';
                    statusText = 'Chưa trả lời';
                } else if (!isCorrect) {
                    borderClass = 'border-error';
                    headerBg = 'bg-error/10';
                    statusIcon = '<span class="material-symbols-outlined text-error">cancel</span>';
                    statusText = 'Sai';
                }

                return `
                    <div id="question-${i}" class="bg-white dark:bg-card-dark rounded-xl border-l-4 ${borderClass} shadow-sm overflow-hidden">
                        <!-- Header -->
                        <div class="flex items-center justify-between p-4 ${headerBg}">
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-lg">Câu ${i + 1}</span>
                                <div class="flex items-center gap-1">
                                    ${statusIcon}
                                    <span class="text-sm font-medium">${statusText}</span>
                                </div>
                            </div>
                        </div>
                        <!-- Question Content -->
                        <div class="p-4 md:p-6 border-b border-gray-100 dark:border-border-dark">
                            <div class="prose dark:prose-invert max-w-none question-content">${processAndRenderMarkdown(q.question || q.content || '')}</div>
                        </div>
                        <!-- Options -->
                        <div class="p-4 md:p-6 grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${options.map((opt, optIdx) => {
                    const optionLabel = String.fromCharCode(65 + optIdx); // A, B, C, D
                    const isUserChoice = userAnswerLetter === optionLabel;
                    const isCorrectOption = correctAnswerLetter === optionLabel;

                    let optClass = 'border-gray-200 dark:border-border-dark bg-gray-50 dark:bg-[#1c2333]';
                    let optIcon = '';

                    if (isCorrectOption) {
                        optClass = 'border-success bg-success/10';
                        optIcon = '<span class="material-symbols-outlined text-success text-lg">check_circle</span>';
                    } else if (isUserChoice && !isCorrectOption) {
                        optClass = 'border-error bg-error/10';
                        optIcon = '<span class="material-symbols-outlined text-error text-lg">cancel</span>';
                    }

                    // Xử lý \n trong option text
                    const optionText = opt.replace(/\\n/g, '\n');

                    return `
                                    <div class="flex items-center gap-3 p-3 rounded-lg border ${optClass}">
                                        <span class="font-bold text-gray-500 dark:text-gray-400">${optionLabel}.</span>
                                        <span class="flex-1 option-content">${optionText}</span>
                                        ${optIcon}
                                    </div>
                                `;
                }).join('')}
                        </div>
                        ${q.explanation ? `
                            <!-- Explanation -->
                            <div class="p-4 md:p-6 bg-blue-50 dark:bg-primary/10 border-t border-blue-100 dark:border-primary/20">
                                <div class="flex items-start gap-3">
                                    <span class="material-symbols-outlined text-primary mt-0.5">lightbulb</span>
                                    <div>
                                        <p class="font-bold text-primary mb-2">Giải thích:</p>
                                        <div class="prose dark:prose-invert max-w-none text-gray-700 dark:text-gray-300 explanation-content">${processAndRenderMarkdown(q.explanation)}</div>
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            // Render KaTeX for all math content
            document.querySelectorAll('.question-content, .option-content, .explanation-content').forEach(el => {
                renderMathInElement(el, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false }
                    ]
                });
            });
        }

        function scrollToQuestion(index) {
            const el = document.getElementById(`question-${index}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }
    </script>
</body>

</html>
